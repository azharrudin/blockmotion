name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/blockmotion/' }}
        run: npm run build -- --base "$VITE_BASE_PATH"

      - name: Validate FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          : "${FTP_SERVER:?Set the FTP_SERVER secret}"
          : "${FTP_USERNAME:?Set the FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Set the FTP_PASSWORD secret}"
          : "${FTP_SERVER_DIR:?Set the FTP_SERVER_DIR variable}"
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "FTP_SERVER_DIR must end with /"
            exit 1
          fi

      - name: Upload static site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || '21' }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          security: strict
          log-level: verbose
